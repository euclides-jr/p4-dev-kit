[package]
edition      = "2024"
name         = "p4-dev-kit"
rust-version = "1.95"
version      = "0.1.0"

[[bin]]
name = "p4-dev-kit"
path = "./src/bin/main.rs"

[build-dependencies]
slint-build = "=1.15.1"

[dependencies]
slint = { version = "=1.15.1", default-features = false, features = ["compat-1-2", "unsafe-single-threaded", "libm", "renderer-software"] }
esp-hal = { version = "~1.2.2", features = ["esp32p4", "unstable"] }

esp-rtos = { version = "0.4.0", features = ["embassy", "esp32p4"] }

esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32p4"] }
esp-println            = { version = "0.18.0", features = ["esp32p4"] }
esp-alloc              = { version = "0.11.0", features = ["esp32p4", "global-allocator"] }

embassy-executor = { version = "0.10.0", features = [] }
embassy-time     = "0.5.0"

critical-section = "1.2.0"
static_cell      = "2.1.1"


# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1     # LLVM can perform better optimizations using a single thread
debug         = 2     # prefer slower builds but better debugging experience
lto           = 'fat'
opt-level     = 's'


[patch.crates-io]
esp-hal = { path = "vendor/esp-hal" }
