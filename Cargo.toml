[package]
edition      = "2024"
name         = "p4-dev-kit"
rust-version = "1.95"
version      = "0.1.0"

[features]
default = ["ppa-preview-sleep"]
ppa-preview-sleep = []

[[bin]]
name = "p4-dev-kit"
path = "./src/bin/main.rs"

[build-dependencies]
slint-build = "=1.15.1"

[dependencies]
log = "0.4"
embedded-io-async = "0.7"
base64 = { version = "0.22", default-features = false }
sha1 = { version = "0.10", default-features = false }
serde = { version = "1", default-features = false, features = ["derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
snow = { version = "0.10", default-features = false, features = ["use-chacha20poly1305", "use-curve25519", "use-sha2"] }
slint = { version = "=1.15.1", default-features = false, features = ["compat-1-2", "unsafe-single-threaded", "libm", "renderer-software"] }
i-slint-renderer-software = { version = "=1.15.1", default-features = false, features = ["experimental"] }
esp-hal = { version = "~1.2.2", features = ["esp32p4", "unstable", "log-04"] }
esp32p4 = "0.3.0"
es8311 = "0.1.1"

esp-rtos = { version = "0.4.0", features = ["embassy", "esp32p4", "rtos-trace"] }
rtos-trace = "0.2.0"

esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32p4"] }
esp-println            = { version = "0.18.0", features = ["esp32p4", "log-04"] }
esp-alloc              = { version = "0.11.0", features = ["esp32p4", "global-allocator"] }

embassy-executor = { version = "0.10.0", features = [] }
embassy-time     = "0.5.0"
embassy-usb-host = "0.1.0"
embassy-usb-driver = "0.2.2"
embassy-sync = "0.8.0"
embassy-futures = "0.1.2"
sdio = "0.5"
aligned = "0.4"
embassy-net = { version = "0.9", features = ["dhcpv4", "icmp", "auto-icmp-echo-reply", "tcp"] }
embassy-net-driver-channel = "0.4"
esp-hosted = "0.1.14"
micropb = "0.3"
zune-jpeg = { version = "0.5.15", default-features = false }

critical-section = "1.2.0"
static_cell      = "2.1.1"


# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1     # LLVM can perform better optimizations using a single thread
debug         = 2     # prefer slower builds but better debugging experience
lto           = 'fat'
opt-level     = 3


[patch.crates-io]
esp-hal = { path = "vendor/esp-hal" }

es8311 = { path = "vendor/es8311" }
